sonar.projectKey=maugus0_ressy-ai-crm
sonar.organization=yushan

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=ressy-ai-crm
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude binary files and build artifacts
sonar.exclusions=**/*.png,**/*.ico,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,**/dist/**,**/node_modules/**,**/coverage/**,**/.next/**,**/build/**,**/*.lockb,**/*.lock

# Exclude test files from main analysis (they're analyzed separately)
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/coverage/**

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info