<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      // SPA redirect for GitHub Pages (BrowserRouter deep links)
      // Inspired by https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var redirect =
          l.protocol +
          "//" +
          l.host +
          l.pathname.replace(/\/[^\/]*$/, "/") +
          "?p=" +
          encodeURIComponent(l.pathname + l.search + l.hash);
        window.location.replace(redirect);
      })();
    </script>
  </body>
</html>
