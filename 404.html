<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      // SPA redirect for GitHub Pages with custom domain (BrowserRouter deep links)
      // Inspired by https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var params = new URLSearchParams(l.search);
        
        // Prevent infinite redirect loops - check if we already have a 'p' parameter
        if (params.has("p")) {
          // If we already have 'p', extract the original path and redirect to index
          try {
            var originalPath = decodeURIComponent(params.get("p"));
            window.location.replace(
              l.protocol + "//" + l.host + "/?p=" + encodeURIComponent(originalPath)
            );
          } catch (e) {
            // If decoding fails, redirect to root
            window.location.replace(l.protocol + "//" + l.host + "/");
          }
          return;
        }
        
        // Extract the actual route
        var route = l.pathname || "/";
        
        // Preserve hash if present
        var hash = l.hash || "";
        
        // Build redirect URL: /?p=/actual/route#hash
        var redirect =
          l.protocol +
          "//" +
          l.host +
          "/?p=" +
          encodeURIComponent(route + hash);
        
        window.location.replace(redirect);
      })();
    </script>
  </body>
</html>
