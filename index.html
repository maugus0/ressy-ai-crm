    <script>
      // GitHub Pages SPA fallback: convert ?p=/some/path back into the real URL
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get("p");
        if (p) {
          window.history.replaceState(null, "", decodeURIComponent(p));
        }
      })();
    </script>
