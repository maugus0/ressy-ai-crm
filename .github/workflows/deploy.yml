name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://dashboard.ressy.ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          # Production API URL for dashboard.ressy.ai
          # Default to localhost:5001 if not set in secrets/variables
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || 'http://localhost:5001' }}
          VITE_API_VERSION: ${{ secrets.VITE_API_VERSION || vars.VITE_API_VERSION || 'v1' }}

      - name: Copy CNAME and 404.html
        run: |
          cp public/CNAME dist/CNAME || echo "CNAME file copied"
          cp public/404.html dist/404.html || echo "404.html file copied"

      - name: Deploy with gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx --yes gh-pages@latest -d dist -b gh-pages \
            -r https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
            --dotfiles

      - name: Health check
        run: |
          echo "Deployment complete. Please verify:"
          echo "https://dashboard.ressy.ai/"
          echo ""
          echo "Note: DNS propagation and SSL certificate may take 5-30 minutes."

